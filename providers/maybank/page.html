<template data-slot="h1">Maybank statement to CSV and QIF</template>
<template data-slot="lede">Turns Maybank (Malaysia) monthly savings and current account statement PDFs (the e-statements from Maybank2u) into CSV or QIF files you can import into a personal finance app, one per account. The PDFs are read in this browser and never uploaded.</template>
<template data-slot="drop-title">Drop statement PDFs here</template>
<template data-slot="drop-help">or click to choose files. Add every month you have; you pick which months to export below.</template>
<template data-slot="mode-label">Funds</template>
<template data-slot="hint">Most apps don't skip duplicates when importing CSVs, so export only months you haven't imported yet. Each account starts from the balance just before the first exported entry (see the Accounts CSV).</template>
<template data-slot="config-help">Detected from the statements: each account (the last digits of the account number tell same-named accounts apart). Override only if something's off: rename the exported account, change its type, merge it into another account, or leave it out. Saved in this browser.</template>
<template data-slot="help-items">
  <li>One <em>Transactions CSV</em> per account with every transaction. The name is the transaction type plus the first description line (the merchant, payee or payer, e.g. <em>SALE DEBIT - SHOP NAME</em>); the notes are the other lines (location, reference, your remark).</li>
  <li>Every row is checked against the running balance printed next to it, and each statement against its beginning and ending balance and its total credit and debit; any mismatch is reported, nothing is adjusted.</li>
  <li>Card pre-authorisations that are refunded in the same statement (a <em>PRE-AUTH DEBIT</em> hold and its <em>PRE-AUTH REFUND</em>) cancel out and are left out; they're listed under <em>What was skipped</em>. A hold without a refund is the actual charge and is kept.</li>
  <li>If a month's statement isn't loaded, one <em>Balance change not covered by statements</em> row keeps later balances exact. Load the missing statement to replace it.</li>
  <li>Accounts without any transactions or balance are left out.</li>
  <li><strong>QIF</strong>: the same transactions as a QIF file per account, starting with an <em>Opening Balance</em> record (the balance just before the first entry), so no separate starting balance or column mapping is needed. QIF has no currency field: import each file into an account of that currency. Dates are <code>YYYY-MM-DD</code>; the name is the payee (<code>P</code>) and the notes the memo (<code>M</code>).</li>
  <li><strong>Accounts CSV</strong>: one row per exported account (<code>Account type, Name, Balance, Currency, Balance Date</code>), with the balance just before the first exported entry. <strong>Combined CSV</strong>: all accounts in one file with a leading <code>account</code> column, for multi-account imports; import the Accounts CSV first so the names match.</li>
  <li>Columns: <code>date, amount, currency, name, notes</code> with <em>inflows positive</em>; dates are <code>YYYY-MM-DD</code>.</li>
</template>

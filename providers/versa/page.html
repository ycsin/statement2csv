<template data-slot="h1">Versa / AHAM Capital statement to CSV and QIF</template>
<template data-slot="lede">Turns the <em>Statement of Account</em> PDF from AHAM Capital (the fund manager behind Versa; download it in the Versa app or AHAM Capital's investor portal) into CSV or QIF files you can import into a personal finance app: every investment, redemption, reinvested distribution and switch, and the account's value at each month-end. The PDF is read in this browser and never uploaded.</template>
<template data-slot="drop-title">Drop statement PDFs here</template>
<template data-slot="drop-help">or click to choose files. One recent statement covers the whole history; you pick which months to export below.</template>
<template data-slot="mode-label">Funds</template>
<template data-slot="hint">Most apps don't skip duplicates when importing CSVs, so export only months you haven't imported yet. Each account starts from the balance just before the first exported entry (see the Accounts CSV).</template>
<template data-slot="config-help">Detected from the statements: each account, with all its funds (per fund currency; the last digits of the account number tell accounts apart). Override only if something's off: rename the exported account, change its type, merge it into another account, or leave it out. Saved in this browser.</template>
<template data-slot="help-items">
  <li>One account per statement account number (and fund currency), holding all its funds. A statement lists every transaction since each holding was last zero, so one recent statement covers the whole history; several statements can be loaded, and repeated rows are kept once.</li>
  <li><strong>Balance only</strong> (default): one <em>Transactions CSV</em> with each <em>Investment</em> (inflow), <em>Redemption</em> (outflow, after charges), sales or redemption charge, and <em>Income distribution (reinvested)</em>, plus one <em>Returns (month-end adjustment)</em> per month so the running balance equals the account's value at each month-end. Switches between funds of the same account move no money and appear only as trades.</li>
  <li>Month-end values are each fund's units times its latest unit price on the statement up to that day: a transaction's price, or the statement's closing NAV. They are exact at the statement date. A fund with few transactions (e.g. one paying distributions twice a year) keeps an older price in between, so its monthly value moves in steps.</li>
  <li><strong>Balance + trade log</strong> adds every purchase and sale of units as a zero-amount line. <strong>With holdings</strong>: trades (units and price, the fund name as ticker), cash and month-end values in separate files.</li>
  <li>Each row's units are checked against the units balance printed next to it, and each fund against its overview (units balance, market value) and the summary's total; any mismatch is reported.</li>
  <li><strong>QIF</strong>: the same transactions as a QIF file per account, starting with an <em>Opening Balance</em> record (the balance just before the first entry), so no separate starting balance or column mapping is needed. QIF has no currency field: import each file into an account of that currency. Dates are <code>YYYY-MM-DD</code>; the name is the payee (<code>P</code>) and the notes the memo (<code>M</code>).</li>
  <li><strong>Accounts CSV</strong>: one row per exported account (<code>Account type, Name, Balance, Currency, Balance Date</code>), with the balance just before the first exported entry. <strong>Combined CSV</strong>: all accounts in one file with a leading <code>account</code> column, for multi-account imports; import the Accounts CSV first so the names match.</li>
  <li>Columns: <code>date, amount, currency, name, notes</code> with <em>inflows positive</em>; dates are <code>YYYY-MM-DD</code>.</li>
</template>

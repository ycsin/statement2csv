<template data-slot="h1">POSB / DBS statement to CSV and QIF</template>
<template data-slot="lede">Turns POSB and DBS (Singapore) monthly <em>Consolidated Statement</em> PDFs (and older <em>Deposit Account Statements</em>), and the <em>transaction history</em> CSV that digibank lets you download for recent months, into CSV or QIF files you can import into a personal finance app, one per deposit account and currency. The files are read in this browser and never uploaded.</template>
<template data-slot="drop-title">Drop statement PDFs or transaction history CSVs here</template>
<template data-slot="drop-help">or click to choose files. Add every month you have; you pick which months to export below.</template>
<template data-slot="mode-label">Funds</template>
<template data-slot="hint">Most apps don't skip duplicates when importing CSVs, so export only months you haven't imported yet. Each account starts from the balance just before the first exported entry (see the Accounts CSV).</template>
<template data-slot="config-help">Detected from the statements: each deposit account, and each currency in a multi-currency account (the last digits of the account number tell same-named accounts apart). Override only if something's off: rename the exported account, change its type, merge it into another account, or leave it out. Saved in this browser.</template>
<template data-slot="help-items">
  <li>One <em>Transactions CSV</em> per account and currency with every transaction. The name is the description plus the counterparty when the statement gives one (<em>TO:</em> / <em>FROM:</em>, a payee, or a bank and account reference); the notes are the remaining lines (references, value date).</li>
  <li>Every row is checked against the running balance printed next to it, and each month against the brought-forward, carried-forward and summary balances; any mismatch is reported, nothing is adjusted.</li>
  <li>Some accounts (e.g. eMySavings) only list their transactions every few months; in between, the month-end balance comes from the statement's account summary. If a month's transactions aren't in any loaded statement, one <em>Balance change not covered by statements</em> row keeps later balances exact. Load the missing statement to replace it.</li>
  <li>A row dated in one month but first listed on the next month's statement keeps its date; it is counted in the earlier month.</li>
  <li><strong>Transaction history CSV</strong> (digibank: the account's transaction history, <em>Download</em>; one account, recent months only): it has no running balance, so balances are worked back from its <em>Ledger Balance</em>. Loaded with statements, it adds only what comes after the last statement for that account, and its balance on that date is checked against the statement; if it doesn't reach back that far, one <em>not covered</em> row bridges the difference. Loaded alone, the account starts on the day before its first transaction. Transactions not yet settled are left out. Several downloads can be combined; transactions already loaded aren't added twice.</li>
  <li>Fixed deposits have no transactions on the statement (placements and maturities appear in the paying account), so they aren't exported. SRS and other accounts without any transactions or balance are left out.</li>
  <li><strong>QIF</strong>: the same transactions as a QIF file per account, starting with an <em>Opening Balance</em> record (the balance just before the first entry), so no separate starting balance or column mapping is needed. QIF has no currency field: import each file into an account of that currency. Dates are <code>YYYY-MM-DD</code>; the name is the payee (<code>P</code>) and the notes the memo (<code>M</code>).</li>
  <li><strong>Accounts CSV</strong>: one row per exported account (<code>Account type, Name, Balance, Currency, Balance Date</code>), with the balance just before the first exported entry. <strong>Combined CSV</strong>: all accounts in one file with a leading <code>account</code> column, for multi-account imports; import the Accounts CSV first so the names match.</li>
  <li>Columns: <code>date, amount, currency, name, notes</code> with <em>inflows positive</em>; dates are <code>YYYY-MM-DD</code>.</li>
</template>

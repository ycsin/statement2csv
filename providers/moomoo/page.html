<template data-slot="h1">moomoo statement to CSV and QIF</template>
<template data-slot="lede">Turns moomoo (Singapore) monthly account statement PDFs into CSV files you can import into a personal finance app: one set per currency for securities and cash, and one per fund (money market and bond funds). The PDFs are read in this browser and never uploaded.</template>
<template data-slot="drop-title">Drop statement PDFs here</template>
<template data-slot="drop-help">or click to choose files. Add every month you have; you pick which months to export below.</template>
<template data-slot="mode-label">Investments</template>
<template data-slot="hint">Most apps don't skip duplicates when importing CSVs, so export only months you haven't imported yet. Load the statement for the month before <em>From</em> as well: the monthly adjustment builds on its closing balance.</template>
<template data-slot="config-help">Detected from the statements: securities and cash per currency, and each fund you've held. Override only if something's off: rename the exported account, change its type, merge it into another account, or leave it out. Saved in this browser.</template>
<template data-slot="help-items">
  <li><strong>Securities &amp; Cash</strong> (one per currency): the cash ledger (deposits, withdrawals, currency exchanges, dividends, coupons, withholding tax, fund subscriptions and redemptions) plus the stocks and ETFs held in that currency. The balance is the statement's net asset value for the currency less the funds.</li>
  <li><strong>Funds</strong> (one per fund): money moved in from cash (subscriptions) and out to cash (redemptions). A subscription paid but not yet allotted at month end counts towards the fund.</li>
  <li><strong>Balance only</strong> (default): one <em>Transactions CSV</em> per account with its cash movements and one <em>Returns (month-end adjustment)</em> row per month, so the running balance equals the statement's value. Buys, sells and price changes all land in the adjustment.</li>
  <li><strong>Balance + trade log</strong>: the same, plus every buy and sell as a 0.00 line with quantity and price.</li>
  <li><strong>With holdings</strong>: a <em>Trades CSV</em> (stock symbols as tickers; ISINs for funds), the cash movements, and a <em>Month-end balances CSV</em> with the value to record as balance updates.</li>
  <li>Subscriptions and redemptions appear in both the cash account and the fund, as transfers.</li>
  <li><strong>QIF</strong> (Balance only and Balance + trade log): the same transactions, including the monthly returns adjustments, as a QIF file per account, starting with an <em>Opening Balance</em> record (the balance just before the first entry), so no separate starting balance or column mapping is needed. Trade lines aren't included (they don't change the balance), and With holdings has no QIF: QIF's bank format can't carry units and prices. QIF has no currency field: import each file into an account of that currency. Dates are <code>YYYY-MM-DD</code>; the name is the payee (<code>P</code>) and the notes the memo (<code>M</code>).</li>
  <li><strong>Accounts CSV</strong>: one row per exported account (<code>Account type, Name, Balance, Currency, Balance Date</code>), with the balance just before the first exported entry. <strong>Combined CSV</strong>: all accounts in one file with a leading <code>account</code> column, for multi-account imports; import the Accounts CSV first so the names match.</li>
  <li>Columns: trades <code>date, ticker, qty, price, currency, name</code> (negative qty = sell); transactions <code>date, amount, currency, name, notes</code> with <em>inflows positive</em>; month-end balances <code>date, balance, currency</code>. Dates are <code>YYYY-MM-DD</code>.</li>
</template>

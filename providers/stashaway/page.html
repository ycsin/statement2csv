<template data-slot="h1">StashAway statement to CSV and QIF</template>
<template data-slot="lede">Turns StashAway monthly statement PDFs into CSV files you can import into a personal finance app, one set per portfolio. The PDFs are read in this browser and never uploaded.</template>
<template data-slot="drop-title">Drop statement PDFs here</template>
<template data-slot="drop-help">or click to choose files. Add every month you have; you pick which months to export below.</template>
<template data-slot="mode-label">Investment portfolios</template>
<template data-slot="accounts-title">One row per portfolio: account type, name, starting balance and date</template>
<template data-slot="combined-title">All portfolios in one file with an account column, for multi-account imports</template>
<template data-slot="hint">Most apps don't skip duplicates when importing CSVs, so export only months you haven't imported yet. Load the statement for the month before <em>From</em> as well: the monthly adjustment builds on its closing balance.</template>
<template data-slot="config-summary">Portfolios</template>
<template data-slot="config-help">Detected from the statements, including renames (a portfolio whose opening balance equals the closing balance of one that disappeared). Override only if something's off: rename the exported account, change its type, merge it into another portfolio, or leave it out. Saved in this browser.</template>
<template data-slot="help-items">
  <li><strong>Balance only</strong> (the default, and always used for cash-like portfolios): one <em>Transactions CSV</em> with deposits, withdrawals, dividends, fees and one <em>Returns (month-end adjustment)</em> row per month. Imported into an account that starts at 0, its running balance equals each statement's closing balance. USD amounts are converted at the statement's month-end rate, with the original amount in the description.</li>
  <li><strong>Balance + trade log</strong> (investment portfolios): the Balance only file plus every buy and sell as a 0.00 line, e.g. <code>Buy 1.5 VWRA @ USD 120.00 (USD 180.00)</code>. A trade swaps cash for units inside the portfolio, so it doesn't change the balance; you get the full activity list without your app having to look up tickers or track holdings.</li>
  <li><strong>With holdings</strong> (investment portfolios, when selected at the top): a <em>Trades CSV</em> with every buy and sell, a <em>Transactions CSV</em> with the cash movements, and a <em>Month-end balances CSV</em> with each statement's closing value. Your app values the holdings itself, so record the month-end balances as balance updates to keep totals exact.</li>
  <li><strong>Combined CSV</strong>: the same data for all portfolios in one file, with a leading <code>account</code> column, for apps whose import can split rows across accounts (a multi-account import). The account names match the Accounts CSV, so import that first and every row maps to the right account. With holdings, this is a zip with a combined trades file and a combined transactions file; month-end balances stay per portfolio.</li>
  <li>Columns: trades <code>date, ticker, qty, price, currency, name</code> (negative qty = sell, price in the trade's currency); transactions <code>date, amount, currency, name</code> with <em>inflows positive</em> (deposits, dividends and gains +; withdrawals, fees and losses −); month-end balances <code>date, balance, currency</code>. Dates are <code>YYYY-MM-DD</code>.</li>
  <li><strong>QIF</strong> (Balance only and Balance + trade log): the same transactions, including the monthly returns adjustments, as a QIF file per account, starting with an <em>Opening Balance</em> record (the balance just before the first entry), so no separate starting balance or column mapping is needed. Trade lines aren't included (they don't change the balance), and With holdings has no QIF: QIF's bank format can't carry units and prices. QIF has no currency field: import each file into an account of that currency. Dates are <code>YYYY-MM-DD</code>; the name is the payee (<code>P</code>) and the notes the memo (<code>M</code>).</li>
  <li><strong>Accounts CSV</strong> (also in the zip): one row per exported portfolio with <code>Account type, Name, Balance, Currency, Balance Date</code>, for apps that create accounts from a file. <em>Investment</em> or <em>Savings</em>, named like the files (<em>StashAway</em> followed by the portfolio name), with the balance just before the first exported entry: 0 for a full history, or the previous month's closing balance when you export from a later month. Import it first, then the other files into those accounts.</li>
  <li>If your app looks tickers up, check the matches: a ticker can belong to a different company on another exchange, so the same ticker on two exchanges can be two unrelated securities.</li>
</template>
<template data-slot="help-extra">
  <details>
    <summary>How portfolios are grouped</summary>
    <ul>
      <li>Each portfolio in the statements becomes one account, named after its latest name. Names are compared as written, apart from "™" and a "StashAway " prefix.</li>
      <li>A renamed portfolio is followed automatically, whether StashAway or you renamed it: when a new name opens with exactly the closing balance of a portfolio that disappeared that month, it is the same portfolio.</li>
      <li>Two portfolios with the same name are told apart by reporting currency, with the currency added to the account name, e.g. <em>Name (SGD)</em> and <em>Name (USD)</em>.</li>
      <li>Portfolios under <em>Investment Portfolios</em> are investment portfolios; those under <em>Cash Management</em> are cash-like and get deposits, withdrawals, fees and rebates only, without fund switches. Fixed-term (Guaranteed) placements are grouped into one cash-like <em>Guaranteed</em> account.</li>
      <li>FX conversions inside a portfolio and fixed-deposit placements are skipped as internal.</li>
      <li>Use <em>Portfolios</em> above to change any of this.</li>
    </ul>
  </details>
</template>

<template data-slot="h1">Example Bank statement to CSV and QIF</template>
<template data-slot="lede">Turns <em>Example Bank</em> monthly statement PDFs into CSV or QIF files you can import into a personal finance app: every transaction of every account on the statements. The PDFs are read in this browser and never uploaded.</template>
<template data-slot="drop-title">Drop statement PDFs here</template>
<template data-slot="drop-help">or click to choose files. Add every month you have; you pick which months to export below.</template>
<template data-slot="mode-label">Funds</template>
<template data-slot="hint">Most apps don't skip duplicates when importing CSVs, so export only months you haven't imported yet. Each account starts from the balance just before the first exported entry (see the Accounts CSV).</template>
<template data-slot="config-help">Detected from the statements: one account per account number and currency. Override only if something's off: rename the exported account, change its type, merge it into another account, or leave it out. Saved in this browser.</template>
<template data-slot="help-items">
<li>One <em>Transactions CSV</em> per account; every month is checked against the statement's opening and closing balance.</li>
{{> help-qif-short}}
{{> help-accounts-combined}}
{{> help-columns-transactions}}
</template>
